<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jev Ultrafast</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">⚡</span>
      <h1>Jev</h1>
      <span id="status" class="pill" data-status="idle" role="status" aria-live="polite">Ready</span>
    </header>

    <form id="task">
      <label for="goal" class="sr">Goal</label>
      <textarea id="goal" rows="3" placeholder="What should happen in this tab?" required></textarea>
      <div class="row">
        <button id="run" type="submit">Run <kbd id="shortcut">⌘↵</kbd></button>
      </div>
      <p id="tab" class="muted tab" title=""></p>
    </form>

    <section id="live" class="live" hidden aria-label="Live run">
      <div class="clock"><span id="timer" class="timer">0.0</span><span class="unit">s</span></div>
      <div class="meta"><span id="count">0 actions</span><span id="phase" class="phase">starting…</span></div>
      <button id="stop" type="button" class="secondary">Stop</button>
    </section>

    <section id="approval" class="approval" hidden role="alertdialog" aria-labelledby="approvalTitle">
      <strong id="approvalTitle">Jev needs your OK</strong>
      <p id="approvalWhat"></p>
      <p id="approvalWhy" class="muted"></p>
      <div class="actions">
        <button id="approve" type="button">Approve</button>
        <button id="deny" type="button" class="secondary">Deny and stop</button>
      </div>
    </section>
    <section id="result" hidden aria-live="polite"></section>

    <ol id="steps" aria-label="Steps"></ol>

    <section id="start">
      <div id="recentWrap" hidden>
        <h2>Recent</h2>
        <ul id="recent" class="list"></ul>
      </div>
      <h2>Try</h2>
      <div id="chips" class="chips"></div>
    </section>

    <details id="settings">
      <summary><span>Settings</span><span id="keyState" class="keystate"></span></summary>
      <label>TypeSafe API key <input id="typesafeKey" type="password" autocomplete="off" /></label>
      <label>Text model API key (OpenRouter) <input id="textKey" type="password" autocomplete="off" /></label>
      <label>Text model <input id="textModel" placeholder="inception/mercury-2.5" /></label>
      <label>TypeSafe model <input id="typesafeModel" placeholder="jev-latest" /></label>
      <p class="muted">Keys stay in this browser's extension storage and are only sent to api.typesafe.ai and openrouter.ai.</p>
      <div class="row">
        <button id="save" type="button" class="secondary">Save</button>
        <span id="saved" class="muted" hidden>Saved</span>
      </div>
      <div class="memory">
        <span id="memory" class="muted"></span>
        <button id="forget" type="button" class="secondary" hidden>Forget</button>
      </div>
    </details>

    <script type="module" src="panel.js"></script>
  </body>
</html>
